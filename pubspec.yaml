name: moviebox
description: a new flutter project
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev dart run change_app_package_name:main moviebox.luganda-translated.movies


version: 1.1.0+10

environment:
  sdk: '>=3.0.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.2
  shared_preferences: ^2.5.3
  #  url_launcher: ^6.1.14
  dio: ^5.8.0+1
  internet_connection_checker: ^3.0.1
  shimmer: ^3.0.0
  intl: ^0.20.2

  flutter_form_builder: 9.0.0
  form_builder_validators: 9.0.0
  flutter_feather_icons: ^2.0.0+1
  sqflite: ^2.4.1
  google_fonts: ^5.1.0
  flutx: ^0.2.0-rc.2
  fluttertoast: ^8.2.12
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  change_app_package_name: ^1.5.0
  chewie: ^1.11.1
  video_player: ^2.9.5
  flutter_rating_bar: ^4.0.1
  keep_screen_on: ^4.0.0
  image_picker: ^1.1.2
  readmore: ^3.0.0
  wakelock_plus: ^1.2.11
  upgrader: ^11.3.1
  onesignal_flutter: ^5.3.0
#  in_app_update: ^4.2.3
#  google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

dependency_overrides:
  intl: any
  http: any
  google_fonts: any
  provider: any
  nested: any

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/